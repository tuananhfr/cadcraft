name: UbotBuild CI

# Gate for UbotBuild work branches: Linux fmt, clippy (native + wasm), tests and the layer check.
# Upstream workflows stay untouched; this one only runs on wip/** pushes and on demand.
on:
  push:
    branches: ["wip/**"]
  workflow_dispatch:
    inputs:
      perf:
        description: Run the ignored workspace SLO measurements (release build)
        type: boolean
        default: false
      windows:
        description: Build and test the desktop app on Windows
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ubotbuild-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Dev profile without debug info: release LTO links each of ~45 test binaries for tens of
  # minutes, and debug info would fill the runner disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CRAFT_FONTS_REF: b7dfde98c6d9d5db761c405732f9ef6d58bec192

jobs:
  linux:
    name: Linux gate
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tuananhfr/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - name: Install Linux build dependencies (winit, wgpu, rfd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
      - name: Install Rust (stable + clippy, rustfmt, wasm32)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: rustfmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      - name: clippy (native)
        if: ${{ !cancelled() }}
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (web, wasm32)
        if: ${{ !cancelled() }}
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: cargo clippy -p cadcraft-ui-egui -p cadcraft-web --target wasm32-unknown-unknown
      - name: tests
        if: ${{ !cancelled() }}
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: |
          set -o pipefail
          cargo test --no-fail-fast --workspace 2>&1 | tee test.log
      - name: layers
        if: ${{ !cancelled() }}
        run: cargo xtask layers
      - name: Summary of failing tests
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Failing tests"
            grep -E '^test .* \.\.\. FAILED$' test.log | sed 's/^test /- /; s/ \.\.\. FAILED$//' || echo "none"
            grep -E '^test result' test.log | awk '{p+=$4; f+=$6} END {print "\npassed=" p " failed=" f}'
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    # Release web bundle for local visual QA (downloaded as an artifact); nothing is deployed from CI.
    name: Web build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tuananhfr/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - name: Install Rust (stable + wasm32)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: web
      - name: Install trunk 0.21.14
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.cargo/bin" trunk
          trunk --version
      - name: trunk build --release
        working-directory: apps/cadcraft-web
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: trunk build --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cadcraft-web-${{ github.sha }}
          path: dist/web
          retention-days: 7

  # On demand only: Windows runner minutes cost twice as much as Linux minutes.
  windows:
    name: Windows desktop
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows }}
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tuananhfr/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - name: Install Rust (stable)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows
      - name: tests
        shell: bash
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: |
          set -o pipefail
          cargo test --no-fail-fast -p cadcraft -p cadcraft-ui-egui 2>&1 | tee test.log
      - name: Build Windows desktop
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: cargo build --release -p cadcraft
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: cadcraft-windows-${{ github.sha }}
          path: target/release/cadcraft.exe
          retention-days: 7
          if-no-files-found: error
      - name: Summary of failing tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "### Failing tests"
            grep -E '^test .* \.\.\. FAILED$' test.log | sed 's/^test /- /; s/ \.\.\. FAILED$//' || echo "none"
            grep -E '^test result' test.log | awk '{p+=$4; f+=$6} END {print "\npassed=" p " failed=" f}'
          } >> "$GITHUB_STEP_SUMMARY"

  perf:
    # On demand only: release builds of two test binaries; shared runners make the numbers indicative.
    name: Workspace SLO
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.perf }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies (winit, wgpu, rfd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: perf
      - name: restore / switch / commit P95
        run: |
          set -o pipefail
          {
            cargo test --release -p cadcraft-ui-egui --test ws_perf -- --ignored --nocapture --test-threads=1
            cargo test --release -p cadcraft --bin cadcraft commit_p95 -- --ignored --nocapture
          } 2>&1 | tee perf.log
      - name: Summary
        if: ${{ !cancelled() }}
        run: grep -E 'P95=|proxies:|FAILED|panicked' perf.log >> "$GITHUB_STEP_SUMMARY" || true
